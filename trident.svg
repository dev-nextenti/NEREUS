<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Central Spear -->
    <path d="M50 8 L54 28 L52 75 L48 75 L46 28 Z" fill="url(#cyanGlow)" />
    <!-- Center Tip Diamond -->
    <polygon points="50,4 56,16 50,22 44,16" fill="#00f0b5" />
    <!-- Left Prong -->
    <path d="M46 38 C32 40 24 28 26 14 L30 18 C28 26 34 34 46 32 Z" fill="url(#cyanGlow)" />
    <polygon points="26,12 30,22 25,20 22,18" fill="#00f0b5" />
    <!-- Right Prong -->
    <path d="M54 38 C68 40 76 28 74 14 L70 18 C72 26 66 34 54 32 Z" fill="url(#cyanGlow)" />
    <polygon points="74,12 78,18 75,20 70,22" fill="#00f0b5" />
    <!-- Bottom Base Ring & Finial -->
    <circle cx="50" cy="80" r="4" fill="url(#cyanGlow)" />
    <path d="M50 84 L53 96 L47 96 Z" fill="url(#cyanGlow)" />
    <circle cx="50" cy="50" r="1.5" fill="#ffffff" />
  </g>
</svg>
